<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Agent POC</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --panel: #ffffff; --border: #d9dde3; --text: #111827; --muted: #6b7280;
      --agent: #eceff3; --user: #2563eb; --user-text: #ffffff; --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e5e7eb; --muted: #9aa3b2; --agent: #232835; --user: #3b82f6; --error: #f97066; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-columns: 340px 1fr; font: 15px/1.45 system-ui, sans-serif; color: var(--text); background: var(--bg); }
    aside { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-right: 1px solid var(--border); background: var(--panel); }
    h1 { margin: 0 0 6px; font-size: 16px; }
    label { font-size: 13px; color: var(--muted); }
    input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; }
    .state { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .state b { font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { padding: 2px 8px; border-radius: 999px; background: var(--agent); font: 12px ui-monospace, monospace; }
    .chip.common { opacity: .65; }
    details { font-size: 13px; min-height: 0; display: flex; flex-direction: column; }
    details[open] { flex: 1; }
    summary { cursor: pointer; color: var(--muted); }
    pre { margin: 6px 0 0; padding: 8px; overflow: auto; max-height: 45vh; white-space: pre-wrap; font: 11px/1.45 ui-monospace, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    .hint { margin-top: auto; font-size: 12px; color: var(--muted); }
    button { font: inherit; padding: 9px 14px; border: 0; border-radius: 8px; background: var(--user); color: #fff; cursor: pointer; }
    button:disabled, input:disabled { opacity: .5; cursor: default; }
    #thread { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    #thread a { color: inherit; }
    main { display: flex; flex-direction: column; min-height: 0; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 20px; }
    .bubble { max-width: 70%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
    .agent { align-self: flex-start; background: var(--agent); }
    .tool { align-self: flex-start; max-width: 85%; color: var(--muted); font: 12px/1.4 ui-monospace, monospace; overflow-wrap: anywhere; }
    .note { align-self: center; color: var(--muted); font-size: 12px; }
    .error { align-self: flex-start; color: var(--error); font-size: 13px; }
    #typing { min-height: 22px; padding: 0 20px 4px; color: var(--muted); font-size: 12px; }
    form { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  </style>
</head>
<body>
  <aside>
    <h1>Chat Agent POC</h1>
    <button id="start">Start new conversation</button>
    <div id="thread"></div>
    <div class="state">
      <div><b>Active skill:</b> <span id="skill">none</span></div>
      <div><b>Tools offered</b></div>
      <div class="chips" id="tools"></div>
    </div>
    <details id="prompt-box">
      <summary>System prompt the model sees next</summary>
      <pre id="prompt"></pre>
    </details>
    <div class="hint">The agent, its skills and tools come from <code>config/</code>. Skill tools return mock data: try booking <b>K7XQ2M</b>, last name <b>Rivera</b>.</div>
  </aside>
  <main>
    <div id="messages"><div class="note">Start a conversation to talk to Mia, Meridian Air's support agent.</div></div>
    <div id="typing"></div>
    <form id="composer">
      <input id="text" placeholder="Type a message… (you can send several before the agent replies)" autocomplete="off" disabled>
      <button id="send" disabled>Send</button>
    </form>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let threadId = null;
    let pending = 0;

    /** Appends a line to the conversation: a 'user' or 'agent' bubble, or a 'tool', 'note' or 'error' line. */
    function add(kind, text) {
      const el = document.createElement('div');
      el.className = kind === 'user' || kind === 'agent' ? `bubble ${kind}` : kind;
      el.textContent = text;
      $('messages').append(el);
      scrollDown();
      return el;
    }

    function scrollDown() {
      $('messages').scrollTop = $('messages').scrollHeight;
    }

    function setPending(delta) {
      pending += delta;
      $('typing').textContent = pending > 0 ? 'Agent is answering…' : '';
    }

    $('start').addEventListener('click', async () => {
      const res = await fetch('/threads', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
      const body = await res.json();
      if (!res.ok) return add('error', body.error);
      threadId = body.thread_id;
      $('messages').replaceChildren();
      add('note', 'New conversation started.');
      const link = Object.assign(document.createElement('a'), { href: `/threads/${threadId}`, target: '_blank', textContent: 'View transcript (JSON)' });
      $('thread').replaceChildren(`Thread ${threadId} · `, link);
      $('text').disabled = $('send').disabled = false;
      $('text').focus();
      await refreshState();
    });

    /** Shows the agent's state after a turn: the applied skill, the tools offered, the system prompt. */
    async function refreshState() {
      const res = await fetch(`/threads/${threadId}`);
      if (!res.ok) return;
      const thread = await res.json();
      $('skill').textContent = thread.active_skill ?? 'none';
      $('tools').replaceChildren(
        ...thread.active_tools.map((name) =>
          Object.assign(document.createElement('span'), { className: ['load_skill', 'end_chat'].includes(name) ? 'chip common' : 'chip', textContent: name }),
        ),
      );
      $('prompt').textContent = thread.system_prompt;
      if (thread.ended && !$('text').disabled) {
        $('text').disabled = $('send').disabled = true;
        add('note', 'The agent ended the chat.');
      }
    }

    $('composer').addEventListener('submit', (event) => {
      event.preventDefault();
      const text = $('text').value.trim();
      if (!text || !threadId) return;
      $('text').value = '';
      add('user', text);
      send(text); // not awaited: the customer can keep writing while the agent answers
    });

    async function send(text) {
      setPending(+1);
      try {
        const res = await fetch(`/threads/${threadId}/messages?stream=true`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (res.headers.get('content-type')?.includes('text/event-stream')) return await readStream(res);
        // Not a stream: an error, or a message answered together with a later one, whose
        // request carries the reply.
        const body = await res.json();
        if (body.error) add('error', body.error);
      } catch (error) {
        add('error', String(error));
      } finally {
        setPending(-1);
        await refreshState();
      }
    }

    function clip(text, max = 160) {
      return text.length > max ? `${text.slice(0, max)}…` : text;
    }

    /** Renders an AI SDK UI message stream: each step is its own reply bubble, and tool calls show as grey lines. */
    async function readStream(res) {
      let bubble = null;
      const toolLines = new Map();
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) return;
        buffer += value;
        let end;
        while ((end = buffer.indexOf('\n\n')) !== -1) {
          const event = buffer.slice(0, end);
          buffer = buffer.slice(end + 2);
          for (const line of event.split('\n')) {
            if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
            const chunk = JSON.parse(line.slice(6));
            switch (chunk.type) {
              case 'start-step':
                bubble = null;
                break;
              case 'text-delta':
                bubble ??= add('agent', '');
                bubble.textContent += chunk.delta;
                scrollDown();
                break;
              case 'tool-input-available':
                toolLines.set(chunk.toolCallId, add('tool', `🔧 ${chunk.toolName}(${clip(JSON.stringify(chunk.input))})`));
                break;
              case 'tool-output-available':
                toolLines.get(chunk.toolCallId)?.append(` → ${clip(JSON.stringify(chunk.output))}`);
                break;
              case 'tool-output-error':
                toolLines.get(chunk.toolCallId)?.append(` → error: ${chunk.errorText}`);
                break;
              case 'error':
                add('error', chunk.errorText);
                break;
            }
          }
        }
      }
    }
  </script>
</body>
</html>
